    <title>Table</title>
</head>
<body>

            <th>S/N</th>
            <th>Name</th>
            <th>Email Address</th>

            <td>Jamal</td>
            <td>jamal@example.com</td>
            <td>Hello, I am interested in learning more about your company.</td>
            <td>Nigeria</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Sarah</td>
            <td>sarah@example.com</td>
            <td>I would like to know more about the opportunities available.</td>
            <td>USA</td>
        </tr>               
        <tr>
            <td>3</td>
            <td>David</td>
            <td>david@example.com</td>
            <td>I am interested in the marketing position.</td>
            <td>Canada</td>
        </tr>
    </table>
</body>
</html>
